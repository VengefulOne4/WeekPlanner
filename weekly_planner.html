<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Недельное расписание</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2f3a;
    --text: #e6e8eb;
    --muted: #8b909c;
    --accent: #5b8cff;
    --accent-dim: #2c3a5e;
    --danger: #ff5c5c;
    --cell-hover: #1f2430;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    padding: 20px;
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 4px;
  }
  .subtitle {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 16px;
  }
  .toolbar {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .toolbar button {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 7px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
  }
  .toolbar button:hover { border-color: var(--accent); }
  .week-label {
    font-weight: 600;
    min-width: 160px;
    text-align: center;
  }
  .legend {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    margin-bottom: 16px;
    font-size: 12px;
    color: var(--muted);
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .legend-swatch {
    width: 10px;
    height: 10px;
    border-radius: 3px;
    flex-shrink: 0;
  }

  .earnings-panel {
    display: flex;
    gap: 12px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .earnings-tile {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 16px;
    min-width: 150px;
  }
  .earnings-tile .label {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 2px;
  }
  .earnings-tile .value {
    font-size: 18px;
    font-weight: 600;
  }
  .earnings-tile .sub {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }

  /* Calendar */
  .cal-wrap {
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .cal-header {
    display: grid;
    grid-template-columns: 56px repeat(7, minmax(110px, 1fr));
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
  }
  .cal-header .time-col-header {
    border-right: 1px solid var(--border);
  }
  .day-header {
    text-align: center;
    padding: 8px 4px;
    font-size: 13px;
    border-right: 1px solid var(--border);
  }
  .day-header:last-child { border-right: none; }
  .day-header .date {
    color: var(--muted);
    font-weight: 400;
    font-size: 11px;
  }
  .calendar-scroll {
    max-height: 65vh;
    overflow-y: auto;
    overflow-x: auto;
  }
  .calendar {
    display: grid;
    grid-template-columns: 56px repeat(7, minmax(110px, 1fr));
    min-width: 900px;
    position: relative;
  }
  .time-labels {
    position: relative;
    border-right: 1px solid var(--border);
    background: var(--panel);
  }
  .time-label {
    position: absolute;
    left: 0;
    right: 4px;
    text-align: right;
    font-size: 11px;
    color: var(--muted);
    transform: translateY(-6px);
  }
  .day-col {
    position: relative;
    border-right: 1px solid var(--border);
    cursor: pointer;
    background-image: repeating-linear-gradient(
      to bottom,
      var(--border) 0,
      var(--border) 1px,
      transparent 1px,
      transparent 60px
    );
    background-size: 100% 60px;
  }
  .day-col:last-child { border-right: none; }
  .day-col:hover { background-color: var(--cell-hover); }

  .task-block {
    position: absolute;
    border-radius: 5px;
    border-left: 3px solid var(--accent);
    background: var(--accent-dim);
    padding: 2px 5px;
    font-size: 11px;
    overflow: hidden;
    cursor: pointer;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.3);
  }
  .task-block .txt {
    display: block;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .task-block .time {
    display: block;
    font-size: 10px;
    opacity: 0.75;
    white-space: nowrap;
  }
  .task-block .del {
    position: absolute;
    top: 1px;
    right: 3px;
    background: none;
    border: none;
    color: var(--danger);
    cursor: pointer;
    font-size: 11px;
    line-height: 1;
    padding: 1px 2px;
  }
  .task-block .del:hover { color: #ff8080; }
  .task-block .toggle {
    position: absolute;
    top: 1px;
    right: 18px;
    background: none;
    border: none;
    color: var(--text);
    opacity: 0.6;
    cursor: pointer;
    font-size: 10px;
    line-height: 1;
    padding: 1px 2px;
  }
  .task-block .toggle:hover { opacity: 1; }
  .task-block.task-disabled {
    opacity: 0.45;
    background-image: repeating-linear-gradient(
      45deg, rgba(255,255,255,0.06), rgba(255,255,255,0.06) 4px,
      transparent 4px, transparent 8px
    );
  }
  .task-block.task-disabled .txt { text-decoration: line-through; }
  .task-block.seg-cont-out {
    border-bottom: 2px dashed rgba(255,255,255,0.35);
    border-bottom-left-radius: 0;
    border-bottom-right-radius: 0;
  }
  .task-block.seg-cont-in {
    border-top: 2px dashed rgba(255,255,255,0.35);
    border-top-left-radius: 0;
    border-top-right-radius: 0;
  }

  /* Modal */
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  .overlay.open { display: flex; }
  .modal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px;
    width: 320px;
  }
  .modal h3 { margin: 0 0 12px; font-size: 15px; }
  .modal label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  .modal input, .modal select {
    width: 100%;
    background: #0f1115;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 8px;
    border-radius: 6px;
    font-size: 13px;
  }
  .time-row {
    display: flex;
    gap: 10px;
  }
  .time-row > div { flex: 1; }
  .hm-row {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .hm-row input { text-align: center; }
  .hm-row span {
    color: var(--muted);
    font-size: 12px;
    flex-shrink: 0;
  }
  .mode-toggle {
    display: flex;
    gap: 6px;
    margin: 10px 0 4px;
  }
  .mode-toggle button {
    flex: 1;
    padding: 6px 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: #0f1115;
    color: var(--muted);
    cursor: pointer;
    font-size: 12px;
  }
  .mode-toggle button.active {
    border-color: var(--accent);
    color: var(--text);
    background: var(--accent-dim);
  }
  .end-hint {
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
  }
  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 16px;
  }
  .modal-actions button {
    padding: 7px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #0f1115;
    color: var(--text);
    cursor: pointer;
    font-size: 13px;
  }
  .modal-actions button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  /* Category manager */
  .cat-list {
    max-height: 240px;
    overflow-y: auto;
    margin-top: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .cat-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .cat-row input[type="color"] {
    width: 32px;
    height: 28px;
    padding: 0;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: none;
    cursor: pointer;
    flex-shrink: 0;
  }
  .cat-row input[type="text"] {
    flex: 1;
  }
  .cat-row button.del {
    background: none;
    border: none;
    color: var(--danger);
    cursor: pointer;
    font-size: 14px;
    padding: 2px 6px;
    flex-shrink: 0;
  }
  .cat-row button.del:hover { color: #ff8080; }
  .cat-row button.del:disabled {
    color: var(--muted);
    cursor: not-allowed;
    opacity: 0.5;
  }
  .cat-rate-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding-left: 40px;
    margin-top: -2px;
  }
  .cat-rate-row label {
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
  }
  .cat-rate-row input {
    width: 90px;
    background: #0f1115;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 5px 7px;
    border-radius: 6px;
    font-size: 12px;
  }
  .fixed-tag {
    font-size: 10px;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 5px;
    flex-shrink: 0;
  }
  .cat-add-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
  }
  .cat-add-row button {
    flex-shrink: 0;
    padding: 7px 12px;
    border-radius: 8px;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    font-size: 13px;
  }
</style>
</head>
<body>

<h1>Недельное расписание <span id="versionBadge" style="font-size:12px;color:var(--muted);font-weight:400;"></span></h1>
<div class="subtitle">Клик по расписанию — добавить задачу в это время (можно с точностью до минуты). Клик по задаче — редактировать.</div>

<div class="toolbar">
  <button id="prevWeek">← Пред. неделя</button>
  <div class="week-label" id="weekLabel"></div>
  <button id="nextWeek">След. неделя →</button>
  <button id="todayBtn">Сегодня</button>
  <button id="manageCatsBtn">Категории</button>
  <button id="updateBtn">Проверить обновления</button>
</div>

<div class="legend" id="legend"></div>

<div class="earnings-panel" id="earningsPanel">
  <div class="earnings-tile">
    <div class="label">Заработок за неделю</div>
    <div class="value" id="weekEarningsValue">0 €</div>
    <div class="sub" id="weekEarningsHours"></div>
  </div>
  <div class="earnings-tile">
    <div class="label">Оценка за 4 недели</div>
    <div class="value" id="monthEarningsValue">0 €</div>
    <div class="sub">неделя × 4</div>
  </div>
</div>

<div class="cal-wrap">
  <div class="cal-header" id="calHeader"></div>
  <div class="calendar-scroll">
    <div class="calendar" id="calendarBody"></div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h3 id="modalTitle">Новая задача</h3>
    <label>Название</label>
    <input type="text" id="taskName" placeholder="Например: тренировка">
    <label>Категория</label>
    <select id="taskCategory"></select>
    <label>Начало</label>
    <input type="time" id="taskStart" step="60">

    <div class="mode-toggle">
      <button type="button" id="modeDurationBtn" class="active" data-mode="duration">Длительность</button>
      <button type="button" id="modeEndBtn" data-mode="end">Время окончания</button>
    </div>

    <div id="durationFields">
      <label>Длительность</label>
      <div class="hm-row">
        <input type="number" id="taskHours" min="0" max="24" step="1" value="1">
        <span>ч</span>
        <input type="number" id="taskMinutes" min="0" max="59" step="5" value="0">
        <span>мин</span>
      </div>
    </div>

    <div id="endFields" style="display:none;">
      <label>Время окончания</label>
      <input type="time" id="taskEnd" step="60">
      <div class="end-hint" id="endHint"></div>
    </div>

    <label style="display:flex;align-items:center;gap:8px;margin-top:14px;cursor:pointer;">
      <input type="checkbox" id="taskDisabled" style="width:auto;">
      <span style="color:var(--text);font-size:13px;">Отключить (не учитывать в расчётах)</span>
    </label>

    <div class="modal-actions">
      <button id="deleteBtn" style="display:none;color:var(--danger);border-color:var(--danger);">Удалить</button>
      <button id="cancelBtn">Отмена</button>
      <button id="saveBtn" class="primary">Сохранить</button>
    </div>
  </div>
</div>

<div class="overlay" id="catOverlay">
  <div class="modal">
    <h3>Категории</h3>
    <div class="cat-list" id="catList"></div>
    <div class="cat-add-row">
      <input type="color" id="newCatColor" value="#5b8cff">
      <input type="text" id="newCatName" placeholder="Новая категория">
      <button id="addCatBtn">+</button>
    </div>
    <div class="modal-actions">
      <button id="catDoneBtn" class="primary">Готово</button>
    </div>
  </div>
</div>

<script>
const ROWH = 60;          // px per hour == 1px per minute
const DAY_HEIGHT = 24 * ROWH;
const SNAP = 5;            // click-to-place snapping, minutes
const DAY_NAMES = ["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];

/* ---------- Categories ---------- */
const CATEGORIES_KEY = "weekly_planner_categories_v1";
const WORK_CATEGORY_ID = "work";
const DEFAULT_CATEGORIES = [
  { id: "work",   label: "Работа",  color: "#5b8cff", fixed: true, hourlyRate: 0 },
  { id: "study",  label: "Учёба",   color: "#9b6bff" },
  { id: "sleep",  label: "Сон",     color: "#4a5568" },
  { id: "sport",  label: "Спорт",   color: "#ff8a5c" },
  { id: "rest",   label: "Отдых",   color: "#5cd6a0" },
  { id: "personal", label: "Личное", color: "#ffd15c" },
  { id: "other",  label: "Другое",  color: "#8b909c" },
];
function ensureWorkCategory(list) {
  const work = list.find(c => c.id === WORK_CATEGORY_ID);
  if (work) {
    work.fixed = true;
    if (typeof work.hourlyRate !== "number" || isNaN(work.hourlyRate)) work.hourlyRate = 0;
  } else {
    list.unshift({ id: WORK_CATEGORY_ID, label: "Работа", color: "#5b8cff", fixed: true, hourlyRate: 0 });
  }
  return list;
}
function loadCategories() {
  try {
    const stored = JSON.parse(localStorage.getItem(CATEGORIES_KEY));
    if (Array.isArray(stored) && stored.length) return ensureWorkCategory(stored);
  } catch (e) {}
  return ensureWorkCategory(DEFAULT_CATEGORIES.map(c => ({ ...c })));
}
function saveCategories() {
  localStorage.setItem(CATEGORIES_KEY, JSON.stringify(CATEGORIES));
}
let CATEGORIES = loadCategories();
function categoryById(id) {
  return CATEGORIES.find(c => c.id === id) || CATEGORIES[0] || { color: "#8b909c", label: "Без категории" };
}
function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}
function makeCategoryId(label) {
  const base = "cat_" + label.toLowerCase().replace(/[^a-zа-яё0-9]+/gi, "_").replace(/^_+|_+$/g, "");
  let id = base || ("cat_" + Date.now());
  let n = 1;
  while (CATEGORIES.some(c => c.id === id)) id = `${base}_${n++}`;
  return id;
}
function buildLegend() {
  document.getElementById("legend").innerHTML = CATEGORIES.map(c =>
    `<div class="legend-item"><span class="legend-swatch" style="background:${c.color}"></span>${escapeHtml(c.label)}</div>`
  ).join("");
}
function buildCategorySelect() {
  const sel = document.getElementById("taskCategory");
  sel.innerHTML = CATEGORIES.map(c => `<option value="${c.id}">${c.label}</option>`).join("");
}
function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

/* ---------- Tasks ---------- */
// task: { id, date (ISO yyyy-mm-dd — the day it STARTS on), start (minutes 0-1439),
//         duration (minutes, may push past midnight into the next date), name, category }
const STORAGE_KEY = "weekly_planner_tasks_v4";
function loadTasks() {
  try {
    const t = JSON.parse(localStorage.getItem(STORAGE_KEY));
    return Array.isArray(t) ? t : [];
  } catch (e) { return []; }
}
function saveTasks() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
}
let tasks = loadTasks();
function genId() {
  return "t_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function getMonday(d) {
  const date = new Date(d);
  const day = date.getDay();
  const diff = (day === 0 ? -6 : 1) - day;
  date.setDate(date.getDate() + diff);
  date.setHours(0,0,0,0);
  return date;
}
function fmt(d) {
  return d.toLocaleDateString("ru-RU", { day: "2-digit", month: "2-digit" });
}
function isoDate(d) { return d.toISOString().slice(0,10); }
function addDays(d, n) {
  const nd = new Date(d);
  nd.setDate(nd.getDate() + n);
  return nd;
}

let currentMonday = getMonday(new Date());
let weekDates = []; // 7 Date objects for the currently displayed week, index 0 = Monday

// Segments actually drawn in a given day column: a task's own start, plus any
// overflow tail carried over from the previous calendar date's task that ran past midnight.
function segmentsForColumn(d) {
  const dateStr = isoDate(weekDates[d]);
  const prevDateStr = isoDate(addDays(weekDates[d], -1));
  const segs = [];

  tasks.filter(t => t.date === dateStr).forEach(t => {
    const capped = Math.min(t.duration, 1440 - t.start);
    segs.push({ start: t.start, duration: capped, task: t, isHead: true, continuesNext: t.start + t.duration > 1440 });
  });

  tasks.filter(t => t.date === prevDateStr && t.start + t.duration > 1440).forEach(t => {
    const overflow = (t.start + t.duration) - 1440;
    segs.push({ start: 0, duration: overflow, task: t, isHead: false, continuesNext: false });
  });

  return segs;
}

function workCategory() {
  return CATEGORIES.find(c => c.id === WORK_CATEGORY_ID) || { hourlyRate: 0 };
}

// Sums the actual duration of non-disabled "Работа" tasks whose start date
// falls in the currently displayed week (segments split across midnight are
// just a visual split of the same task, so this uses task.duration directly).
function weekWorkMinutes() {
  if (!weekDates.length) return 0;
  const weekDateStrs = new Set(weekDates.map(isoDate));
  return tasks
    .filter(t => t.category === WORK_CATEGORY_ID && !t.disabled && weekDateStrs.has(t.date))
    .reduce((sum, t) => sum + t.duration, 0);
}

function updateEarningsPanel() {
  const rate = workCategory().hourlyRate || 0;
  const minutes = weekWorkMinutes();
  const hours = minutes / 60;
  const weekEarnings = hours * rate;
  const monthEarnings = weekEarnings * 4;

  const fmtMoney = (n) => n.toLocaleString("ru-RU", { maximumFractionDigits: 2, minimumFractionDigits: 0 }) + " €";
  const fmtHours = (h) => {
    const wh = Math.floor(h), wm = Math.round((h - wh) * 60);
    return `${wh} ч ${wm} мин работы, ${rate} €/ч`;
  };

  document.getElementById("weekEarningsValue").textContent = fmtMoney(weekEarnings);
  document.getElementById("weekEarningsHours").textContent = fmtHours(hours);
  document.getElementById("monthEarningsValue").textContent = fmtMoney(monthEarnings);
}

function pad2(n) { return String(n).padStart(2, "0"); }
function minutesToTimeStr(m) {
  m = Math.max(0, Math.min(1439, Math.round(m)));
  return `${pad2(Math.floor(m/60))}:${pad2(m%60)}`;
}
function timeStrToMinutes(str) {
  const [h, m] = str.split(":").map(Number);
  if (isNaN(h) || isNaN(m)) return null;
  return h * 60 + m;
}

/* ---------- Calendar skeleton (built once) ---------- */
function buildSkeleton() {
  const header = document.getElementById("calHeader");
  header.innerHTML = `<div class="time-col-header"></div>` +
    DAY_NAMES.map((_, i) => `<div class="day-header" id="dayHeader${i}"></div>`).join("");

  const body = document.getElementById("calendarBody");
  body.style.height = DAY_HEIGHT + "px";

  let timeLabelsHtml = `<div class="time-labels" style="height:${DAY_HEIGHT}px">`;
  for (let h = 0; h < 24; h++) {
    timeLabelsHtml += `<div class="time-label" style="top:${h*ROWH}px">${pad2(h)}:00</div>`;
  }
  timeLabelsHtml += `</div>`;

  let dayColsHtml = "";
  for (let d = 0; d < 7; d++) {
    dayColsHtml += `<div class="day-col" id="dayCol${d}" data-day="${d}" style="height:${DAY_HEIGHT}px"></div>`;
  }
  body.innerHTML = timeLabelsHtml + dayColsHtml;

  for (let d = 0; d < 7; d++) {
    document.getElementById(`dayCol${d}`).addEventListener("click", (e) => {
      if (e.target.closest(".task-block")) return;
      const col = e.currentTarget;
      const rect = col.getBoundingClientRect();
      let minutes = ((e.clientY - rect.top) / ROWH) * 60;
      minutes = Math.round(minutes / SNAP) * SNAP;
      minutes = Math.max(0, Math.min(1435, minutes));
      const idx = Number(col.dataset.day);
      openModal(isoDate(weekDates[idx]), minutes, null);
    });
  }
}

function buildHeader() {
  weekDates = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(currentMonday);
    d.setDate(d.getDate() + i);
    weekDates.push(d);
    document.getElementById(`dayHeader${i}`).innerHTML =
      `${DAY_NAMES[i]}<br><span class="date">${fmt(d)}</span>`;
  }
}

function updateWeekLabel() {
  const end = new Date(currentMonday);
  end.setDate(end.getDate() + 6);
  document.getElementById("weekLabel").textContent =
    `${fmt(currentMonday)} — ${fmt(end)} ${currentMonday.getFullYear()}`;
}

/* ---------- Overlap layout ---------- */
function layoutDay(dayTasks) {
  const sorted = [...dayTasks].sort((a, b) => a.start - b.start);
  let clusters = [];
  let current = [];
  let currentEnd = -1;
  sorted.forEach(t => {
    if (current.length && t.start >= currentEnd) {
      clusters.push(current);
      current = [];
      currentEnd = -1;
    }
    current.push(t);
    currentEnd = Math.max(currentEnd, t.start + t.duration);
  });
  if (current.length) clusters.push(current);

  clusters.forEach(cluster => {
    const colEnds = [];
    cluster.forEach(t => {
      let colIndex = colEnds.findIndex(end => end <= t.start);
      if (colIndex === -1) { colIndex = colEnds.length; colEnds.push(0); }
      colEnds[colIndex] = t.start + t.duration;
      t._col = colIndex;
    });
    cluster.forEach(t => { t._colCount = colEnds.length; });
  });
  return sorted;
}

/* ---------- Grid rendering ---------- */
function buildGrid() {
  for (let d = 0; d < 7; d++) {
    const col = document.getElementById(`dayCol${d}`);
    col.innerHTML = "";
    const laidOut = layoutDay(segmentsForColumn(d));
    laidOut.forEach(seg => renderSegment(col, seg));
  }
  updateEarningsPanel();
}

function fullEndLabel(t) {
  const rawEnd = t.start + t.duration;
  if (rawEnd > 1440) return minutesToTimeStr(rawEnd - 1440) + " (+1 день)";
  return minutesToTimeStr(rawEnd);
}

function renderSegment(col, seg) {
  const t = seg.task;
  const cat = categoryById(t.category);
  const top = (seg.start / 60) * ROWH;
  const height = Math.max((seg.duration / 60) * ROWH, 16);
  const colCount = seg._colCount || 1;
  const colIndex = seg._col || 0;
  const widthPct = 100 / colCount;
  const leftPct = colIndex * widthPct;

  const div = document.createElement("div");
  div.className = "task-block";
  if (!seg.isHead) div.classList.add("seg-cont-in");
  if (seg.continuesNext) div.classList.add("seg-cont-out");
  if (t.disabled) div.classList.add("task-disabled");
  div.style.top = top + "px";
  div.style.height = height + "px";
  div.style.left = `calc(${leftPct}% + 2px)`;
  div.style.width = `calc(${widthPct}% - 4px)`;
  div.style.borderLeftColor = cat.color;
  div.style.background = hexToRgba(cat.color, 0.25);

  const startLabel = minutesToTimeStr(t.start);
  const endLabel = fullEndLabel(t);
  div.title = `${t.name} (${startLabel}–${endLabel})`;

  const timeLine = seg.isHead
    ? `${startLabel}–${seg.continuesNext ? "…" : endLabel}`
    : `…–${minutesToTimeStr(seg.duration)}`;

  div.innerHTML = `
    <button class="del" title="Удалить">✕</button>
    <button class="toggle" title="${t.disabled ? "Включить" : "Отключить (не учитывать в расчётах)"}">${t.disabled ? "▶" : "⏸"}</button>
    <span class="txt">${escapeHtml(t.name)}</span>
    <span class="time">${timeLine}</span>
  `;
  div.querySelector(".del").addEventListener("click", (e) => {
    e.stopPropagation();
    tasks = tasks.filter(x => x.id !== t.id);
    saveTasks();
    buildGrid();
  });
  div.querySelector(".toggle").addEventListener("click", (e) => {
    e.stopPropagation();
    t.disabled = !t.disabled;
    saveTasks();
    buildGrid();
  });
  div.addEventListener("click", (e) => {
    if (e.target.closest(".del") || e.target.closest(".toggle")) return;
    openModal(t.date, t.start, t.id);
  });

  col.appendChild(div);
}

/* ---------- Modal (add / edit task) ---------- */
const overlay = document.getElementById("overlay");
const taskNameInput = document.getElementById("taskName");
const taskCategorySelect = document.getElementById("taskCategory");
const taskStartInput = document.getElementById("taskStart");
const taskHoursInput = document.getElementById("taskHours");
const taskMinutesInput = document.getElementById("taskMinutes");
const taskEndInput = document.getElementById("taskEnd");
const endHint = document.getElementById("endHint");
const durationFields = document.getElementById("durationFields");
const endFields = document.getElementById("endFields");
const modeDurationBtn = document.getElementById("modeDurationBtn");
const modeEndBtn = document.getElementById("modeEndBtn");
const taskDisabledInput = document.getElementById("taskDisabled");
const deleteBtn = document.getElementById("deleteBtn");
const modalTitle = document.getElementById("modalTitle");
let pendingDate = null, editingId = null, durationMode = "duration";

function setDurationMode(mode) {
  durationMode = mode;
  const isDuration = mode === "duration";
  durationFields.style.display = isDuration ? "" : "none";
  endFields.style.display = isDuration ? "none" : "";
  modeDurationBtn.classList.toggle("active", isDuration);
  modeEndBtn.classList.toggle("active", !isDuration);
  if (!isDuration) syncEndFromDuration();
}

function currentDurationMinutes() {
  const h = parseInt(taskHoursInput.value, 10) || 0;
  const m = parseInt(taskMinutesInput.value, 10) || 0;
  return h * 60 + m;
}
function setDurationFields(totalMinutes) {
  taskHoursInput.value = Math.floor(totalMinutes / 60);
  taskMinutesInput.value = totalMinutes % 60;
}
function syncEndFromDuration() {
  const start = timeStrToMinutes(taskStartInput.value);
  if (start === null) return;
  const dur = currentDurationMinutes();
  const end = (start + dur) % 1440;
  taskEndInput.value = minutesToTimeStr(end);
  updateEndHint(dur);
}
// duration from start/end, treating end <= start as crossing midnight into the next day
function endModeDuration(start, end) {
  return end > start ? end - start : (1440 - start) + end;
}
function updateEndHint(dur) {
  if (dur <= 0) { endHint.textContent = "Конец должен быть позже начала."; return; }
  const h = Math.floor(dur / 60), m = dur % 60;
  const wrap = dur > 0 && (timeStrToMinutes(taskStartInput.value) + dur) > 1440;
  endHint.textContent = `Длительность: ${h} ч ${m} мин${wrap ? " · заканчивается на следующий день" : ""}`;
}

taskStartInput.addEventListener("change", () => { if (durationMode === "end") syncEndFromDuration(); });
taskHoursInput.addEventListener("input", () => { if (durationMode === "end") syncEndFromDuration(); });
taskMinutesInput.addEventListener("input", () => { if (durationMode === "end") syncEndFromDuration(); });
taskEndInput.addEventListener("input", () => {
  const start = timeStrToMinutes(taskStartInput.value);
  const end = timeStrToMinutes(taskEndInput.value);
  if (start === null || end === null) return;
  updateEndHint(endModeDuration(start, end));
});

modeDurationBtn.addEventListener("click", () => setDurationMode("duration"));
modeEndBtn.addEventListener("click", () => setDurationMode("end"));

function openModal(dateStr, startMinutes, taskId) {
  pendingDate = dateStr;
  buildCategorySelect();
  setDurationMode("duration");

  if (taskId) {
    editingId = taskId;
    const t = tasks.find(x => x.id === taskId);
    modalTitle.textContent = "Редактировать задачу";
    taskNameInput.value = t.name;
    taskCategorySelect.value = t.category || (CATEGORIES[0] ? CATEGORIES[0].id : "");
    taskStartInput.value = minutesToTimeStr(t.start);
    setDurationFields(t.duration);
    taskDisabledInput.checked = !!t.disabled;
    deleteBtn.style.display = "inline-block";
  } else {
    editingId = null;
    modalTitle.textContent = "Новая задача";
    taskNameInput.value = "";
    taskCategorySelect.value = CATEGORIES[0] ? CATEGORIES[0].id : "";
    taskStartInput.value = minutesToTimeStr(startMinutes);
    setDurationFields(60);
    taskDisabledInput.checked = false;
    deleteBtn.style.display = "none";
  }
  syncEndFromDuration();

  overlay.classList.add("open");
  taskNameInput.focus();
}
function closeModal() {
  overlay.classList.remove("open");
  pendingDate = null; editingId = null;
}

document.getElementById("cancelBtn").addEventListener("click", closeModal);
overlay.addEventListener("click", (e) => { if (e.target === overlay) closeModal(); });

deleteBtn.addEventListener("click", () => {
  if (editingId) {
    tasks = tasks.filter(x => x.id !== editingId);
    saveTasks();
    buildGrid();
  }
  closeModal();
});

document.getElementById("saveBtn").addEventListener("click", () => {
  const name = taskNameInput.value.trim();
  if (!name) { taskNameInput.focus(); return; }

  const start = timeStrToMinutes(taskStartInput.value);
  if (start === null) { taskStartInput.focus(); return; }

  let duration;
  if (durationMode === "duration") {
    duration = currentDurationMinutes();
  } else {
    const end = timeStrToMinutes(taskEndInput.value);
    if (end === null) { taskEndInput.focus(); return; }
    duration = endModeDuration(start, end); // wraps past midnight if end <= start
  }
  if (!duration || duration < 5) {
    alert("Длительность должна быть не меньше 5 минут.");
    return;
  }
  duration = Math.min(duration, 1440); // cap at 24h — a task can carry over at most one night

  const category = taskCategorySelect.value;
  const disabled = taskDisabledInput.checked;

  if (editingId) {
    const t = tasks.find(x => x.id === editingId);
    t.name = name; t.category = category; t.start = start; t.duration = duration; t.disabled = disabled;
  } else {
    tasks.push({ id: genId(), date: pendingDate, start, duration, name, category, disabled });
  }
  saveTasks();
  buildGrid();
  closeModal();
});

taskNameInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") document.getElementById("saveBtn").click();
  if (e.key === "Escape") closeModal();
});

/* ---------- Category manager ---------- */
const catOverlay = document.getElementById("catOverlay");
const catList = document.getElementById("catList");
const newCatName = document.getElementById("newCatName");
const newCatColor = document.getElementById("newCatColor");

function renderCatList() {
  catList.innerHTML = "";
  CATEGORIES.forEach(c => {
    const row = document.createElement("div");
    row.className = "cat-row";
    row.innerHTML = `
      <input type="color" value="${c.color}">
      <input type="text" value="${escapeHtml(c.label)}">
      ${c.fixed ? `<span class="fixed-tag" title="Нельзя удалить — используется для расчёта заработка">фикс.</span>` : ""}
      <button class="del" title="Удалить" ${c.fixed ? "disabled" : ""}>✕</button>
    `;
    const [colorInput, nameInput] = row.querySelectorAll("input");
    const delBtn = row.querySelector(".del");

    colorInput.addEventListener("input", () => {
      c.color = colorInput.value;
      saveCategories();
      buildLegend();
      buildGrid();
    });
    nameInput.addEventListener("change", () => {
      const val = nameInput.value.trim();
      if (val) { c.label = val; saveCategories(); buildLegend(); }
      else nameInput.value = c.label;
    });
    delBtn.addEventListener("click", () => {
      if (c.fixed) {
        alert("Категорию «" + c.label + "» нельзя удалить — она используется для расчёта заработка.");
        return;
      }
      if (CATEGORIES.length <= 1) { alert("Должна остаться хотя бы одна категория."); return; }
      const fallback = CATEGORIES.find(x => x.id !== c.id);
      tasks.forEach(t => { if (t.category === c.id) t.category = fallback.id; });
      CATEGORIES = CATEGORIES.filter(x => x.id !== c.id);
      saveCategories();
      saveTasks();
      renderCatList();
      buildLegend();
      buildGrid();
    });

    catList.appendChild(row);

    if (c.fixed) {
      const rateRow = document.createElement("div");
      rateRow.className = "cat-rate-row";
      rateRow.innerHTML = `<label>Ставка, €/час</label><input type="number" min="0" step="0.5" value="${c.hourlyRate || 0}">`;
      const rateInput = rateRow.querySelector("input");
      rateInput.addEventListener("input", () => {
        c.hourlyRate = parseFloat(rateInput.value) || 0;
        saveCategories();
        updateEarningsPanel();
      });
      catList.appendChild(rateRow);
    }
  });
}

document.getElementById("manageCatsBtn").addEventListener("click", () => {
  renderCatList();
  newCatName.value = "";
  newCatColor.value = "#5b8cff";
  catOverlay.classList.add("open");
});
document.getElementById("catDoneBtn").addEventListener("click", () => catOverlay.classList.remove("open"));
catOverlay.addEventListener("click", (e) => { if (e.target === catOverlay) catOverlay.classList.remove("open"); });
document.getElementById("addCatBtn").addEventListener("click", () => {
  const label = newCatName.value.trim();
  if (!label) { newCatName.focus(); return; }
  CATEGORIES.push({ id: makeCategoryId(label), label, color: newCatColor.value });
  saveCategories();
  newCatName.value = "";
  newCatColor.value = "#5b8cff";
  renderCatList();
  buildLegend();
});
newCatName.addEventListener("keydown", (e) => { if (e.key === "Enter") document.getElementById("addCatBtn").click(); });

/* ---------- Week navigation ---------- */
function refreshAll() {
  updateWeekLabel();
  buildHeader();
  buildGrid();
}
document.getElementById("prevWeek").addEventListener("click", () => {
  currentMonday.setDate(currentMonday.getDate() - 7);
  currentMonday = getMonday(currentMonday);
  refreshAll();
});
document.getElementById("nextWeek").addEventListener("click", () => {
  currentMonday.setDate(currentMonday.getDate() + 7);
  currentMonday = getMonday(currentMonday);
  refreshAll();
});
document.getElementById("todayBtn").addEventListener("click", () => {
  currentMonday = getMonday(new Date());
  refreshAll();
});

/* ---------- Updates (desktop only, via pywebview) ---------- */
function isDesktop() {
  return !!(window.pywebview && window.pywebview.api);
}

async function loadVersionBadge() {
  const badge = document.getElementById("versionBadge");
  if (!isDesktop()) { badge.textContent = ""; return; }
  try {
    const v = await window.pywebview.api.get_version();
    badge.textContent = "v" + v;
  } catch (e) { badge.textContent = ""; }
}

const updateBtn = document.getElementById("updateBtn");
updateBtn.addEventListener("click", async () => {
  if (!isDesktop()) {
    alert("Проверка обновлений доступна только в десктопной версии приложения.");
    return;
  }
  const originalLabel = updateBtn.textContent;
  updateBtn.disabled = true;
  updateBtn.textContent = "Проверка...";
  try {
    const res = await window.pywebview.api.check_for_update();
    if (!res.ok) {
      alert("Не удалось проверить обновления:\n" + res.error);
      return;
    }
    if (!res.hasUpdate) {
      alert("У вас последняя версия.");
      return;
    }
    if (confirm("Доступно обновление. Установить и перезапустить приложение?")) {
      updateBtn.textContent = "Обновление...";
      // process restarts on success — no response will come back
      window.pywebview.api.update_and_restart();
    }
  } catch (e) {
    alert("Ошибка обновления: " + e);
  } finally {
    updateBtn.disabled = false;
    updateBtn.textContent = originalLabel;
  }
});

function initDesktopIntegration() {
  loadVersionBadge();
}
if (window.pywebview) {
  initDesktopIntegration();
} else {
  window.addEventListener("pywebviewready", initDesktopIntegration);
}

/* ---------- Init ---------- */
buildSkeleton();
buildLegend();
refreshAll();
</script>
